<div class="quick-actions-panel">
    <h3 class="quick-actions__title">Quick Actions</h3>
    
    <div class="quick-actions__list">
        <button class="quick-action-btn" data-action="upload">
            <span class="quick-action-btn__icon">
                <i class="bi bi-cloud-arrow-up"></i>
            </span>
            <span class="quick-action-btn__text">
                <span class="quick-action-btn__title">Upload Resume</span>
                <span class="quick-action-btn__desc">Analyze new resume</span>
            </span>
            <span class="quick-action-btn__arrow" aria-hidden="true">→</span>
        </button>
        
        <button class="quick-action-btn" data-action="create">
            <span class="quick-action-btn__icon">
                <i class="bi bi-magic"></i>
            </span>
            <span class="quick-action-btn__text">
                <span class="quick-action-btn__title">Create Resume</span>
                <span class="quick-action-btn__desc">Use AI template</span>
            </span>
            <span class="quick-action-btn__arrow" aria-hidden="true">→</span>
        </button>
        
        <button class="quick-action-btn" data-action="report">
            <span class="quick-action-btn__icon">
                <i class="bi bi-file-earmark-pdf"></i>
            </span>
            <span class="quick-action-btn__text">
                <span class="quick-action-btn__title">View Report</span>
                <span class="quick-action-btn__desc">Latest analysis</span>
            </span>
            <span class="quick-action-btn__arrow" aria-hidden="true">→</span>
        </button>
        
        <button class="quick-action-btn" data-action="match">
            <span class="quick-action-btn__icon">
                <i class="bi bi-bullseye"></i>
            </span>
            <span class="quick-action-btn__text">
                <span class="quick-action-btn__title">Match Job</span>
                <span class="quick-action-btn__desc">Compare with JD</span>
            </span>
            <span class="quick-action-btn__arrow" aria-hidden="true">→</span>
        </button>
    </div>
    
    <div class="quick-actions__footer">
        <h4 class="quick-actions__subtitle">Getting Started?</h4>
        <p class="quick-actions__text">Check out our <a href="#" class="quick-actions__link">documentation</a> to learn more.</p>
    </div>
</div>
