<div class="resume-template-ai-insights" data-ai-insights-template>
  <header class="aii-header">
    <div>
      <p class="aii-kicker">AI Insights · Career Profile</p>
      <h1 data-field="full-name"></h1>
      <p class="aii-title" data-field="professional-title"></p>
      <div class="aii-contact" data-field="contact"></div>
    </div>
    <div class="aii-mark" aria-hidden="true">AI</div>
  </header>
  <section class="aii-snapshot" aria-label="Resume snapshot" data-field="metrics"></section>
  <main>
    <section data-section="summary">
      <h2>Professional Summary</h2>
      <div data-field="summary"></div>
    </section>
    <section data-section="career_objective">
      <h2>Career Objective</h2>
      <div data-field="career-objective"></div>
    </section>
    <section data-section="experience">
      <h2>Experience & Outcomes</h2>
      <div data-field="experience"></div>
    </section>
    <section data-section="projects">
      <h2>Projects & Applied Work</h2>
      <div data-field="projects"></div>
    </section>
    <section data-section="skills">
      <h2>Skills & Expertise</h2>
      <div data-field="skills"></div>
    </section>
    <section data-section="education">
      <h2>Education</h2>
      <div data-field="education"></div>
    </section>
    <section data-section="certifications">
      <h2>Certifications</h2>
      <div data-field="certifications"></div>
    </section>
    <section data-section="languages">
      <h2>Languages</h2>
      <div data-field="languages"></div>
    </section>
    <div data-field="custom-sections"></div>
  </main>
</div>
