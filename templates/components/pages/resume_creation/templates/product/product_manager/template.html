<div class="resume-template-product-manager" data-product-manager-template>
  <header class="pm-header">
    <div class="pm-header-main">
      <p class="pm-eyebrow">PRODUCT LEADERSHIP</p>
      <h1 data-field="full-name"></h1>
      <p class="pm-title" data-field="professional-title"></p>
    </div>
    <div class="pm-contact" data-field="contact"></div>
  </header>
  <main>
    <section data-section="summary"><h2>Product Profile</h2><div data-field="summary"></div></section>
    <section data-section="skills"><h2>Product &amp; Leadership Skills</h2><div data-field="skills"></div></section>
    <section data-section="experience"><h2>Product Experience</h2><div data-field="experience"></div></section>
    <section data-section="projects"><h2>Product Launches &amp; Projects</h2><div data-field="projects"></div></section>
    <section data-section="education"><h2>Education</h2><div data-field="education"></div></section>
    <section data-section="certifications"><h2>Certifications</h2><div data-field="certifications"></div></section>
    <section data-section="languages"><h2>Languages</h2><div data-field="languages"></div></section>
    <div data-field="custom-sections"></div>
  </main>
</div>
