<div class="resume-template-scholars-folio" data-scholars-folio-template>
  <header class="sf-header">
    <p class="sf-kicker">Scholar's Folio · Curriculum Vitae</p>
    <h1 data-field="full-name"></h1>
    <p class="sf-title" data-field="professional-title"></p>
    <div class="sf-contact" data-field="contact"></div>
    <div class="sf-motto"><span>RESEARCH</span><span>DISCOVERY</span><span>IMPACT</span></div>
  </header>
  <div class="sf-layout">
    <aside class="sf-rail">
      <section data-section="career_objective"><h2>Research Agenda</h2><div data-field="career-objective"></div></section>
      <section data-section="skills"><h2>Methods & Expertise</h2><div data-field="skills"></div></section>
      <section data-section="certifications"><h2>Credentials</h2><div data-field="certifications"></div></section>
      <section data-section="languages"><h2>Languages</h2><div data-field="languages"></div></section>
    </aside>
    <main class="sf-main">
      <section data-section="summary"><h2>Scholarly Profile</h2><div data-field="summary"></div></section>
      <section data-section="experience"><h2>Research & Teaching Experience</h2><div data-field="experience"></div></section>
      <section data-section="projects"><h2>Selected Research & Publications</h2><div data-field="projects"></div></section>
      <section data-section="education"><h2>Education</h2><div data-field="education"></div></section>
      <div data-field="custom-sections"></div>
    </main>
  </div>
</div>
