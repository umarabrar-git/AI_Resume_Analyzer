<div class="resume-template-academic-research" data-academic-research-template>
  <header class="ar-header">
    <p class="ar-kicker">Academic Curriculum Vitae</p>
    <h1 data-field="full-name"></h1>
    <p class="ar-title" data-field="professional-title"></p>
    <div class="ar-contact" data-field="contact"></div>
    <div class="ar-header-rule" aria-hidden="true"></div>
  </header>
  <main>
    <section data-section="summary">
      <h2>Research Profile</h2>
      <div data-field="summary"></div>
    </section>
    <section data-section="career_objective">
      <h2>Research Objective</h2>
      <div data-field="career-objective"></div>
    </section>
    <section data-section="skills">
      <h2>Research & Technical Skills</h2>
      <div data-field="skills"></div>
    </section>
    <section data-section="experience">
      <h2>Research & Professional Experience</h2>
      <div data-field="experience"></div>
    </section>
    <section data-section="education">
      <h2>Education</h2>
      <div data-field="education"></div>
    </section>
    <section data-section="projects">
      <h2>Selected Research & Projects</h2>
      <div data-field="projects"></div>
    </section>
    <section data-section="certifications">
      <h2>Certifications & Training</h2>
      <div data-field="certifications"></div>
    </section>
    <section data-section="languages">
      <h2>Languages</h2>
      <div data-field="languages"></div>
    </section>
    <div data-field="custom-sections"></div>
  </main>
</div>
