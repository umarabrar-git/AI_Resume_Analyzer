<div class="resume-template-research-dossier" data-research-dossier-template>
  <header class="rd-header">
    <div class="rd-header-top"><span>Research dossier</span><span data-field="location"></span></div>
    <h1 data-field="full-name"></h1>
    <p class="rd-title" data-field="professional-title"></p>
    <div class="rd-contact" data-field="contact"></div>
    <div class="rd-focus"><span>RESEARCH PROFILE</span><div data-field="summary"></div></div>
  </header>
  <main class="rd-grid">
    <div class="rd-primary">
      <section data-section="experience"><h2>Research & Professional Experience</h2><div data-field="experience"></div></section>
      <section data-section="projects"><h2>Selected Research Projects</h2><div data-field="projects"></div></section>
      <section data-section="education"><h2>Education</h2><div data-field="education"></div></section>
      <div data-field="custom-sections"></div>
    </div>
    <aside class="rd-secondary">
      <section data-section="skills"><h2>Methods & Skills</h2><div data-field="skills"></div></section>
      <section data-section="career_objective"><h2>Research Direction</h2><div data-field="career-objective"></div></section>
      <section data-section="certifications"><h2>Credentials</h2><div data-field="certifications"></div></section>
      <section data-section="languages"><h2>Languages</h2><div data-field="languages"></div></section>
    </aside>
  </main>
</div>
