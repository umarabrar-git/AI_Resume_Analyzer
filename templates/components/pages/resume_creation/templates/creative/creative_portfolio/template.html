<div class="resume-template-creative-portfolio" data-creative-portfolio-template>
  <header class="cp-header">
    <div class="cp-header-copy">
      <p class="cp-kicker">Selected Work · Professional Profile</p>
      <h1 data-field="full-name"></h1>
      <p class="cp-title" data-field="professional-title"></p>
      <div class="cp-contact" data-field="contact"></div>
    </div>
    <div class="cp-monogram" aria-hidden="true">CP</div>
  </header>
  <section class="cp-intro" data-field="summary"></section>
  <main>
    <section data-section="experience"><h2>Experience</h2><div data-field="experience"></div></section>
    <section data-section="projects"><h2>Selected Projects</h2><div data-field="projects"></div></section>
    <section data-section="skills"><h2>Creative Toolkit</h2><div data-field="skills"></div></section>
    <section data-section="education"><h2>Education</h2><div data-field="education"></div></section>
    <section data-section="certifications"><h2>Certifications</h2><div data-field="certifications"></div></section>
    <section data-section="languages"><h2>Languages</h2><div data-field="languages"></div></section>
    <div data-field="custom-sections"></div>
  </main>
</div>
