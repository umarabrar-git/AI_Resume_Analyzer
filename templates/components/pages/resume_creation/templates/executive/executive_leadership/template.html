<div class="resume-template-executive-leadership" data-executive-leadership-template>
  <header class="el-header">
    <p class="el-kicker">Leadership Profile</p>
    <h1 data-field="full-name"></h1>
    <p class="el-title" data-field="professional-title"></p>
    <div class="el-contact" data-field="contact"></div>
    <div class="el-rule" aria-hidden="true"></div>
  </header>
  <main>
    <section data-section="summary">
      <h2>Executive Summary</h2>
      <div data-field="summary"></div>
    </section>
    <section data-section="experience">
      <h2>Leadership Experience</h2>
      <div data-field="experience"></div>
    </section>
    <section data-section="projects">
      <h2>Strategic Initiatives</h2>
      <div data-field="projects"></div>
    </section>
    <section data-section="education">
      <h2>Education</h2>
      <div data-field="education"></div>
    </section>
    <section data-section="skills">
      <h2>Core Competencies</h2>
      <div data-field="skills"></div>
    </section>
    <section data-section="certifications">
      <h2>Certifications & Governance</h2>
      <div data-field="certifications"></div>
    </section>
    <section data-section="languages">
      <h2>Languages</h2>
      <div data-field="languages"></div>
    </section>
    <div data-field="custom-sections"></div>
  </main>
</div>
