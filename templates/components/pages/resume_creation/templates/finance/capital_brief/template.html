<div class="resume-template-capital-brief">
  <header class="cb-header">
    <div class="cb-topline"><span>CAPITAL BRIEF</span><span>FINANCE / STRATEGY / PERFORMANCE</span></div>
    <h1 data-field="full-name"></h1>
    <p class="cb-title" data-field="professional-title"></p>
    <div class="cb-contact" data-field="contact"></div>
  </header>
  <div class="cb-metrics" aria-label="Professional focus">
    <div><strong>01</strong><span>ANALYZE</span></div>
    <div><strong>02</strong><span>OPTIMIZE</span></div>
    <div><strong>03</strong><span>DELIVER</span></div>
  </div>
  <div class="cb-layout">
    <aside class="cb-rail">
      <section data-section="skills"><h2>Capabilities</h2><div data-field="skills"></div></section>
      <section data-section="certifications"><h2>Credentials</h2><div data-field="certifications"></div></section>
      <section data-section="languages"><h2>Languages</h2><div data-field="languages"></div></section>
      <section data-section="career_objective"><h2>Career Focus</h2><div data-field="career-objective"></div></section>
    </aside>
    <main class="cb-main">
      <section data-section="summary"><h2>Executive Summary</h2><div data-field="summary"></div></section>
      <section data-section="experience"><h2>Experience</h2><div data-field="experience"></div></section>
      <section data-section="projects"><h2>Selected Analysis & Projects</h2><div data-field="projects"></div></section>
      <section data-section="education"><h2>Education</h2><div data-field="education"></div></section>
      <div data-field="custom-sections"></div>
    </main>
  </div>
