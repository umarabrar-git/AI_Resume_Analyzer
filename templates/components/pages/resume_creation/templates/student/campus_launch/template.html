<div class="resume-template resume-template-campus-launch">
  <header class="campus-header">
    <div class="campus-kicker">EARLY CAREER PROFILE</div>
    <h1 data-field="full_name"></h1>
    <p class="campus-title" data-field="professional_title"></p>
    <p class="campus-contact" data-field="contact"></p>
    <div class="campus-links">
      <a data-field="linkedin"></a>
      <a data-field="github"></a>
      <a data-field="portfolio"></a>
    </div>
  </header>
  <div class="campus-layout">
    <main class="campus-main">
      <section data-section="summary"><h2>Profile</h2><p data-field="summary"></p></section>
      <section data-section="career_objective"><h2>Career Objective</h2><p data-field="career_objective"></p></section>
      <section data-section="projects"><h2>Selected Projects</h2><div data-list="projects"></div></section>
      <section data-section="experience"><h2>Experience</h2><div data-list="experience"></div></section>
      <section data-section="custom_sections"><div data-list="custom_sections"></div></section>
    </main>
    <aside class="campus-sidebar">
      <section data-section="education"><h2>Education</h2><div data-list="education"></div></section>
      <section data-section="skills"><h2>Skills</h2><div data-list="skills"></div></section>
      <section data-section="certifications"><h2>Certifications</h2><div data-list="certifications"></div></section>
      <section data-section="languages"><h2>Languages</h2><div data-list="languages"></div></section>
    </aside>
  </div>
</div>
