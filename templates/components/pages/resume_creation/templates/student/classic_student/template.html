<div class="resume-template resume-template-classic-student">
  <header class="student-header">
    <div class="student-identity">
      <h1 data-field="full_name"></h1>
      <p class="student-title" data-field="professional_title"></p>
      <p class="student-contact" data-field="contact"></p>
    </div>
    <div class="student-links">
      <a data-field="linkedin"></a>
      <a data-field="github"></a>
      <a data-field="portfolio"></a>
    </div>
  </header>

  <main class="student-body">
    <section data-section="summary">
      <h2>Professional Summary</h2>
      <p data-field="summary"></p>
    </section>

    <section data-section="career_objective">
      <h2>Career Objective</h2>
      <p data-field="career_objective"></p>
    </section>

    <section data-section="education">
      <h2>Education</h2>
      <div data-list="education"></div>
    </section>

    <section data-section="experience">
      <h2>Experience</h2>
      <div data-list="experience"></div>
    </section>

    <section data-section="projects">
      <h2>Projects</h2>
      <div data-list="projects"></div>
    </section>

    <section data-section="skills">
      <h2>Technical Skills</h2>
      <div data-list="skills"></div>
    </section>

    <section data-section="certifications">
      <h2>Certifications</h2>
      <div data-list="certifications"></div>
    </section>

    <section data-section="languages">
      <h2>Languages</h2>
      <div data-list="languages"></div>
    </section>

    <section data-section="custom_sections">
      <div data-list="custom_sections"></div>
    </section>
  </main>
</div>
