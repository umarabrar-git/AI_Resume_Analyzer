<div class="resume-template-clinical-compass">
  <header class="cc-header">
    <div class="cc-kicker">PATIENT CARE · CLINICAL PRACTICE</div>
    <h1 data-field="full-name"></h1>
    <p data-field="professional-title"></p>
    <div data-field="contact"></div>
  </header>
  <div class="cc-layout">
    <aside class="cc-rail">
      <section data-section="skills"><h2>Clinical Skills</h2><div data-field="skills"></div></section>
      <section data-section="certifications"><h2>Licensure</h2><div data-field="certifications"></div></section>
      <section data-section="languages"><h2>Languages</h2><div data-field="languages"></div></section>
    </aside>
    <main class="cc-main">
      <section data-section="summary"><h2>Clinical Profile</h2><div data-field="summary"></div></section>
      <section data-section="experience"><h2>Clinical Experience</h2><div data-field="experience"></div></section>
      <section data-section="education"><h2>Education & Training</h2><div data-field="education"></div></section>
      <section data-section="projects"><h2>Research & Quality Improvement</h2><div data-field="projects"></div></section>
      <section data-section="career_objective"><h2>Career Focus</h2><div data-field="career-objective"></div></section>
      <div data-field="custom-sections"></div>
    </main>
  </div>
</div>
