<div class="resume-template-healthcare-professional">
  <header class="hp-header">
    <div class="hp-header-mark" aria-hidden="true">+</div>
    <div class="hp-header-main">
      <h1 data-field="full-name"></h1>
      <p data-field="professional-title"></p>
      <div data-field="contact"></div>
    </div>
  </header>
  <main>
    <section data-section="summary"><h2>Professional Profile</h2><div data-field="summary"></div></section>
    <section data-section="skills"><h2>Clinical & Professional Competencies</h2><div data-field="skills"></div></section>
    <section data-section="experience"><h2>Clinical & Professional Experience</h2><div data-field="experience"></div></section>
    <section data-section="education"><h2>Education & Training</h2><div data-field="education"></div></section>
    <section data-section="certifications"><h2>Licensure & Certifications</h2><div data-field="certifications"></div></section>
    <section data-section="projects"><h2>Research & Selected Projects</h2><div data-field="projects"></div></section>
    <section data-section="languages"><h2>Languages</h2><div data-field="languages"></div></section>
    <section data-section="career_objective"><h2>Career Objective</h2><div data-field="career-objective"></div></section>
    <div data-field="custom-sections"></div>
  </main>
</div>
