<div class="resume-template-growth-engine">
  <header class="ge-header">
    <div class="ge-kicker">GROWTH / PERFORMANCE / EXPERIMENTATION</div>
    <h1 data-field="full-name"></h1>
    <p class="ge-title" data-field="professional-title"></p>
    <div class="ge-contact" data-field="contact"></div>
  </header>
  <div class="ge-thesis">
    <div><b>ACQUIRE</b><span>Build qualified demand</span></div>
    <div><b>CONVERT</b><span>Improve every journey</span></div>
    <div><b>LEARN</b><span>Scale proven experiments</span></div>
  </div>
  <div class="ge-columns">
    <aside class="ge-sidebar">
      <section data-section="skills"><h2>Growth Toolkit</h2><div data-field="skills"></div></section>
      <section data-section="certifications"><h2>Certifications</h2><div data-field="certifications"></div></section>
      <section data-section="education"><h2>Education</h2><div data-field="education"></div></section>
    </aside>
    <main class="ge-main">
      <section data-section="summary"><h2>Growth Profile</h2><div data-field="summary"></div></section>
      <section data-section="experience"><h2>Performance & Growth Experience</h2><div data-field="experience"></div></section>
      <section data-section="projects"><h2>Experiments & Selected Wins</h2><div data-field="projects"></div></section>
    </main>
  </div>
</div>
