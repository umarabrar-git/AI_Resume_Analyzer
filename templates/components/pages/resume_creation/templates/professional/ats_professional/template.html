<div class="resume-template-ats-professional" data-ats-professional-template>
  <header class="ap-header">
    <h1 data-field="full-name"></h1>
    <p class="ap-title" data-field="professional-title"></p>
    <div class="ap-contact" data-field="contact"></div>
  </header>
  <main>
    <section data-section="summary"><h2>Professional Summary</h2><div data-field="summary"></div></section>
    <section data-section="skills"><h2>Core Competencies</h2><div data-field="skills"></div></section>
    <section data-section="experience"><h2>Professional Experience</h2><div data-field="experience"></div></section>
    <section data-section="projects"><h2>Selected Projects</h2><div data-field="projects"></div></section>
    <section data-section="education"><h2>Education</h2><div data-field="education"></div></section>
    <section data-section="certifications"><h2>Certifications</h2><div data-field="certifications"></div></section>
    <section data-section="languages"><h2>Languages</h2><div data-field="languages"></div></section>
    <div data-field="custom-sections"></div>
  </main>
</div>
