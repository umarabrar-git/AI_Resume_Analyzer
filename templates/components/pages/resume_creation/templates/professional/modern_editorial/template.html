<div class="resume-template-modern-editorial" data-modern-editorial-template>
  <header class="me-header">
    <p class="me-eyebrow">Professional Profile</p>
    <h1 data-field="full-name"></h1>
    <p class="me-title" data-field="professional-title"></p>
    <div class="me-contact" data-field="contact"></div>
    <div class="me-header-rule" aria-hidden="true"></div>
  </header>
  <main>
    <section data-section="summary">
      <h2><span>01</span> Profile</h2>
      <div data-field="summary"></div>
    </section>
    <section data-section="career_objective">
      <h2><span>02</span> Objective</h2>
      <div data-field="career-objective"></div>
    </section>
    <section data-section="skills">
      <h2><span>03</span> Core Skills</h2>
      <div data-field="skills"></div>
    </section>
    <section data-section="experience">
      <h2><span>04</span> Experience</h2>
      <div data-field="experience"></div>
    </section>
    <section data-section="education">
      <h2><span>05</span> Education</h2>
      <div data-field="education"></div>
    </section>
    <section data-section="projects">
      <h2><span>06</span> Selected Projects</h2>
      <div data-field="projects"></div>
    </section>
    <section data-section="certifications">
      <h2><span>07</span> Certifications</h2>
      <div data-field="certifications"></div>
    </section>
    <section data-section="languages">
      <h2><span>08</span> Languages</h2>
      <div data-field="languages"></div>
    </section>
    <div data-field="custom-sections"></div>
  </main>
</div>
