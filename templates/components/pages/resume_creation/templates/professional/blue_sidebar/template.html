<div class="resume-template-blue-sidebar" data-blue-sidebar-template>
  <aside class="blue-sidebar">
    <div class="blue-sidebar-profile">
      <div class="blue-sidebar-photo" data-field="profile-photo"></div>
      <h1 data-field="sidebar-name"></h1>
      <p data-field="sidebar-title"></p>
    </div>

    <section class="blue-sidebar-section" data-section="contact">
      <h2><span>●</span> Contact</h2>
      <div class="blue-contact-list" data-field="contact"></div>
    </section>

    <section class="blue-sidebar-section" data-section="skills">
      <h2><span>⚙</span> Technical Skills</h2>
      <div data-field="skills"></div>
    </section>

    <section class="blue-sidebar-section" data-section="languages">
      <h2><span>◎</span> Languages</h2>
      <div data-field="languages"></div>
    </section>

    <section class="blue-sidebar-section" data-section="interests">
      <h2><span>♥</span> Interests</h2>
      <div data-field="interests"></div>
    </section>
  </aside>

  <main class="blue-main">
    <header class="blue-main-header">
      <h1 data-field="full-name"></h1>
      <p data-field="professional-title"></p>
      <div class="blue-header-links" data-field="header-links"></div>
    </header>

    <div class="blue-main-sections">
      <section class="blue-main-section" data-section="summary">
        <div class="blue-section-heading"><span>👤</span><h2>Professional Summary</h2></div>
        <div data-field="summary"></div>
      </section>

      <section class="blue-main-section" data-section="career_objective">
        <div class="blue-section-heading"><span>🎯</span><h2>Career Objective</h2></div>
        <div data-field="career-objective"></div>
      </section>

      <section class="blue-main-section" data-section="experience">
        <div class="blue-section-heading"><span>💼</span><h2>Experience</h2></div>
        <div data-field="experience"></div>
      </section>

      <section class="blue-main-section" data-section="education">
        <div class="blue-section-heading"><span>🎓</span><h2>Education</h2></div>
        <div data-field="education"></div>
      </section>

      <section class="blue-main-section" data-section="projects">
        <div class="blue-section-heading"><span>💻</span><h2>Projects</h2></div>
        <div data-field="projects"></div>
      </section>

      <section class="blue-main-section" data-section="certifications">
        <div class="blue-section-heading"><span>🏆</span><h2>Certifications</h2></div>
        <div data-field="certifications"></div>
      </section>

      <div data-field="custom-sections"></div>
    </div>
  </main>
</div>
