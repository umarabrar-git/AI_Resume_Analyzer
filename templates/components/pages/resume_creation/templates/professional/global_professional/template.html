<div class="resume-template-global-professional">

    <h1 data-field="full-name"></h1>
    <p data-field="professional-title"></p>
    <div data-field="contact"></div>
  </header>
  <main>
    <section data-section="summary"><h2>Professional Summary</h2><div data-field="summary"></div></section>

    <section data-section="certifications"><h2>Certifications & Training</h2><div data-field="certifications"></div></section>
