<div class="resume-template-insight-grid" data-insight-grid-template>
  <header class="ig-header">
    <div>
      <p class="ig-eyebrow">Analytics & Business Intelligence</p>
      <h1 data-field="full-name"></h1>
      <p class="ig-role" data-field="professional-title"></p>
      <div class="ig-contact" data-field="contact"></div>
    </div>
    <div class="ig-monogram" aria-hidden="true">IG</div>
  </header>
  <section class="ig-highlights" aria-label="Profile highlights" data-field="highlights"></section>
  <main>
    <section data-section="summary"><h2>Analytical Profile</h2><div data-field="summary"></div></section>
    <section data-section="experience"><h2>Experience & Business Impact</h2><div data-field="experience"></div></section>
    <section data-section="projects"><h2>Data & BI Projects</h2><div data-field="projects"></div></section>
    <section data-section="skills"><h2>Analytics Toolkit</h2><div data-field="skills"></div></section>
    <section data-section="education"><h2>Education</h2><div data-field="education"></div></section>
    <section data-section="certifications"><h2>Certifications</h2><div data-field="certifications"></div></section>
    <section data-section="languages"><h2>Languages</h2><div data-field="languages"></div></section>
    <div data-field="custom-sections"></div>
  </main>
</div>
