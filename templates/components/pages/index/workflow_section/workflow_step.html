<article class="workflow-step" data-workflow-step>
    <span class="workflow-step__number">{{ step.index }}</span>
    <span class="workflow-step__icon" aria-hidden="true">
        <i class="bi {{ step.icon }}"></i>
    </span>
    <h3 class="workflow-step__title">{{ step.title }}</h3>
    <p class="workflow-step__desc">{{ step.desc }}</p>
</article>
