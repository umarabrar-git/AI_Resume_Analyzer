<article class="testimonial-card" data-testimonial-card>
    <div class="testimonial-card__stars">
        <i class="bi bi-star-fill"></i>
        <i class="bi bi-star-fill"></i>
        <i class="bi bi-star-fill"></i>
        <i class="bi bi-star-fill"></i>
        <i class="bi bi-star-fill"></i>
    </div>
    <p class="testimonial-card__quote">"{{ item.quote }}"</p>
    <div class="testimonial-card__meta">
        <div class="testimonial-card__avatar">{{ item.name[0] }}</div>
        <div class="testimonial-card__info">
            <h3 class="testimonial-card__name">{{ item.name }}</h3>
            <p class="testimonial-card__role">{{ item.role }}</p>
        </div>
    </div>
</article>
